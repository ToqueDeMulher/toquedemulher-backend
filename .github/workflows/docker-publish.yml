name: Build and Publish to GHCR

on:
  push:
    branches: ['main'] # Triggers automatically when you push to main

env:
  REGISTRY: ghcr.io
  # github.repository is automatically formatted as owner/repo (e.g., octocat/my-app)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Crucial: This grants the GITHUB_TOKEN permission to push to the registry
    permissions:
      contents: read
      packages: write 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Automatically tags the image with the branch name and Git SHA

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
